<!doctype html>
<!--[if lt IE 7]><html class="no-js lt-ie9 lt-ie8 lt-ie7" lang="en"> <![endif]-->
<!--[if (IE 7)&!(IEMobile)]><html class="no-js lt-ie9 lt-ie8" lang="en"><![endif]-->

<head>
{% include _head.html %}
</head>

<body class="home">

{% include _browser-upgrade.html %}
{% include _navigation.html %}

<section class="hero">
  <div class="container hero-inner">
    <img class="hero-photo" src="{{ site.github.url }}/images/{{ site.owner.avatar }}" alt="{{ site.owner.name }}">
    <div>
      <h1>{{ site.owner.name }}</h1>
      <p class="hero-role">{{ site.owner.bio }}</p>
      {% if page.tagline %}<p class="hero-tagline">{{ page.tagline }}</p>{% endif %}
      {% include _social-links.html %}
    </div>
  </div>
</section>

<article class="container content" role="main">
  {{ content }}
</article>

<footer class="site-footer">
  <div class="container">
    {% include _footer.html %}
  </div>
</footer>

{% include _scripts.html %}

</body>
</html>
