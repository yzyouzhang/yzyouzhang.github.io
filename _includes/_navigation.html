<header class="site-header">
	<div class="container site-header-inner">
		<a class="site-brand" href="{{ site.github.url }}/">{{ site.owner.name }}</a>
		<nav role="navigation" id="site-nav" class="nav">
		    <ul>
		        {% for link in site.data.navigation %}
				    {% if link.url contains 'http' %}
				        {% assign domain = '' %}
				        {% else %}
				        {% assign domain = site.github.url %}
				    {% endif %}
				    <li{% if page.url == link.url or page.url == '/index.html' and link.url == '/' %} class="current"{% endif %}><a href="{{ domain }}{{ link.url }}" {% if link.url contains 'http' %}target="_blank"{% endif %}>{{ link.title }}</a></li>
				{% endfor %}
		    </ul>
		</nav>
	</div>
</header>
